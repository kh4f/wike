name: Release

on: { push: { tags: 'v[0-9]+.[0-9]+.[0-9]+*' } }

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      TAG: ${{ github.ref_name }}
      ZIP: ${{ github.event.repository.name }}-${{ github.ref_name }}.zip

    steps:
      - uses: actions/checkout@v6
      - { uses: actions/setup-go@v6, with: { go-version: 1.26.0 } }
      - run: |
            sudo apt-get install -y binutils-mingw-w64-x86-64
            sudo ln -s /usr/bin/x86_64-w64-mingw32-windres /usr/local/bin/windres

      - run: go run tasks.go -b
      - run: zip $ZIP Wike.exe WikeDaemon.exe
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $TAG $ZIP --title $TAG --draft